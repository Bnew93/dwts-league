# Nightly data dump of the public schema (PHASE_1_5 §8). Free tier has no managed backups, so this
# is the safety net: pg_dump through the Supabase session pooler, gzipped, kept as a workflow
# artifact for 90 days. Fails loudly when the dump is empty or shrank by more than half since the
# last run.
#
# Required repository secret: SUPABASE_DB_PASSWORD — the raw Postgres password (Supabase →
# Project Settings → Database). No URL assembly, no URL-encoding: libpq reads it as-is.
# Host, user, and database are fixed below; both pooler hostnames for the region are tried.
name: backup

on:
  schedule:
    - cron: "17 8 * * *" # 08:17 UTC daily ≈ 4:17 AM ET
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PGUSER: postgres.kuuvuywwiaoakdpnbqch
  PGDATABASE: postgres
  PGPORT: "5432"
  PGSSLMODE: require

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install pg_dump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Dump public schema (data only)
        id: dump
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -uo pipefail
          test -n "$PGPASSWORD" || { echo "SUPABASE_DB_PASSWORD secret is not set"; exit 1; }
          ok=0
          for host in aws-0-us-east-1.pooler.supabase.com aws-1-us-east-1.pooler.supabase.com; do
            echo "trying $host"
            if pg_dump --data-only --schema=public --no-owner --no-privileges --host "$host" > dump.sql 2> err.txt; then
              ok=1; echo "connected via $host"; break
            fi
            cat err.txt
          done
          test "$ok" = 1 || { echo "pg_dump failed on every pooler host"; exit 1; }
          gzip -9 dump.sql
          size=$(stat -c%s dump.sql.gz)
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "dump.sql.gz is $size bytes"
          test "$size" -gt 200 || { echo "dump is empty"; exit 1; }

      - name: Compare with the previous dump
        env:
          GH_TOKEN: ${{ github.token }}
          SIZE: ${{ steps.dump.outputs.size }}
        run: |
          set -euo pipefail
          prev=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=db-dump&per_page=1" --jq '.artifacts[0].size_in_bytes // 0')
          echo "previous=$prev current=$SIZE"
          if [ "$prev" -gt 0 ] && [ $((SIZE * 2)) -lt "$prev" ]; then
            echo "dump shrank by more than 50% (was $prev, now $SIZE) — refusing to treat this as a good backup"
            exit 1
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: db-dump
          path: dump.sql.gz
          retention-days: 90
          if-no-files-found: error
